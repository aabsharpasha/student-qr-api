<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - QR Attendance</title>
    <style>
        :root {
            --muted: #6b7280;
            --accent: #0ea5a4;
            --surface: #ffffff;
            --navy: #1B365D;
            --gold: #C9A227;
            --success: #2E7D32;
            --warning: #ED6C02;
            --card-shadow: 0 4px 20px rgba(16, 24, 40, 0.1);
            --card-radius: 16px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(160deg, #f0f4f8 0%, #e8eef4 100%);
            color: #111827;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--navy);
            color: #fff;
            padding: 24px 32px;
            margin-bottom: 32px;
            box-shadow: 0 2px 12px rgba(27, 54, 93, 0.2);
        }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.02em;
        }
        .page-header p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .refresh-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.3); }
        .refresh-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px 48px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 28px;
            align-items: start;
        }
        .qr-card {
            background: var(--surface);
            border-radius: var(--card-radius);
            padding: 24px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .qr-card h2 {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            color: var(--navy);
            font-weight: 600;
        }
        .qr-card > p {
            font-size: 0.875rem;
            color: var(--muted);
            margin: 0 0 16px 0;
            line-height: 1.5;
        }
        .qr-box {
            max-width: 280px;
            margin: 0 auto 12px;
            padding: 16px;
            background: linear-gradient(180deg, #fbfeff 0%, #f5f9fc 100%);
            border-radius: 12px;
            border: 1px solid #e5eaf0;
        }
        .qr-box img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }
        .timer {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
        }
        .attendance-wrap {
            background: var(--surface);
            border-radius: var(--card-radius);
            padding: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
        }
        .attendance-wrap h2 {
            font-size: 1.1rem;
            margin: 0 0 20px 0;
            color: var(--navy);
            font-weight: 600;
        }
        .table-scroll {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #eef2f7;
        }
        table.attendance-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 640px;
        }
        table.attendance-table thead th {
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            color: var(--navy);
            font-weight: 600;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        table.attendance-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            color: #374151;
            vertical-align: middle;
        }
        table.attendance-table tbody tr:nth-child(even) {
            background: #fafbfc;
        }
        table.attendance-table tbody tr:hover {
            background: #f1f5f9;
        }
        table.attendance-table tbody tr:last-child td {
            border-bottom: none;
        }
        .muted { color: var(--muted); }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace; font-size: 0.78rem; }
        .photo-cell { padding: 6px 10px; vertical-align: middle; }
        .photo-cell img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; display: block; background: #e5e7eb; }
        .photo-cell .photo-id { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
        .status-ok {
            color: var(--success);
            font-weight: 600;
            font-size: 0.78rem;
        }
        .status-photo-issue { color: #ED6C02; font-weight: 600; font-size: 0.72rem; cursor: help; }  /* Amber - face verification */
        .status-location-issue { color: #1565C0; font-weight: 600; font-size: 0.72rem; cursor: help; }  /* Blue - location mismatch */
        .status-issue { color: var(--warning); font-weight: 600; font-size: 0.72rem; cursor: help; }  /* Fallback */
        .status-issues-list { display: block; line-height: 1.4; }
        .status-issues-list span { display: block; }
        .empty-state, .error-state {
            padding: 24px 16px;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .error-state { color: #b91c1c; }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; padding: 0 16px 32px; }
            .qr-card { order: 0; }
            .attendance-wrap { order: 1; }
            .page-header { padding: 20px 24px; }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div>
            <h1>QR Attendance Dashboard</h1>
            <p>Class: {{ class_id }} — Students scan the QR code to mark attendance</p>
        </div>
        <button type="button" class="refresh-btn" id="refreshBtn" onclick="refreshAttendance()">↻ Refresh to see latest attendance</button>
    </header>
    <div class="container">
        <div class="qr-card">
            <h2>Scan to Mark Attendance</h2>
            <p>Students should scan the code below using the attendance app.</p>
            <div class="qr-box">
                <img id="qrImage" src="/qr-code" alt="QR code">
            </div>
            <div class="timer" id="timerText">Refreshing in 30s...</div>
        </div>

        <div class="attendance-wrap">
            <h2>Recent Attendance</h2>
            <div class="table-scroll">
                <table class="attendance-table" id="attendanceTable">
                    <thead>
                        <tr>
                            <th>Photo</th>
                            <th>Student ID</th>
                            <th>DIGIPIN</th>
                            <th>Lat, Long</th>
                            <th>Scanned At (IST)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceBody">
                        <tr><td colspan="6" class="empty-state">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const TIMEZONE = 'Asia/Kolkata';  // Indian Standard Time
        let timeLeft = 30;
        const qrImg = document.getElementById('qrImage');
        const timerTxt = document.getElementById('timerText');

        setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                    qrImg.src = "/qr-code?t=" + new Date().getTime();
                    timeLeft = 30;
                }
            timerTxt.innerText = "Refreshing in " + timeLeft + "s...";
        }, 1000);

            window.PLACEHOLDER_SVG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5"><circle cx="12" cy="8" r="3"/><path d="M5 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>');
            const PLACEHOLDER_SVG = window.PLACEHOLDER_SVG;
            async function fetchAttendance() {
                try {
                    const res = await fetch(`/api/attendance?class_id=${encodeURIComponent('{{ class_id }}')}&limit=100`);
                    if (!res.ok) throw new Error('Failed to load');
                    const data = await res.json();
                    const body = document.getElementById('attendanceBody');
                    if (!data || data.length === 0) {
                        body.innerHTML = '<tr><td colspan="6" class="empty-state">No attendance recorded yet.</td></tr>';
                        return;
                    }
                    body.innerHTML = data.map(r => {
                        const latlong = (r.student_lat && r.student_long) ? `${r.student_lat.toFixed(6)}, ${r.student_long.toFixed(6)}` : '';
                        let scanned = '';
                        if (r.scanned_at) {
                            try {
                                const dt = new Date(r.scanned_at);
                                scanned = new Intl.DateTimeFormat('en-IN', {
                                    timeZone: TIMEZONE,
                                    year: 'numeric', month: 'short', day: '2-digit',
                                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                                    hour12: false
                                }).format(dt) + ' IST';
                            } catch (e) {
                                scanned = r.scanned_at;
                            }
                        }
                        // Parse reasons: face verification failed + location mismatch (from DIGIPIN clustering)
                        const raw = (r.suspicious_reason || (r.suspicious ? 'Face verification failed' : '')).trim();
                        const parts = raw ? raw.split(/;\s*/).map(s => s.trim()).filter(Boolean) : [];
                        const hasPhoto = parts.some(p => /face|verification|failed|photo|mismatch/i.test(p));
                        const hasLocation = parts.some(p => /outside|location|class|digipin/i.test(p));
                        const photoLabel = 'Face verification failed';
                        const locationLabel = 'Proximity mismatch: Student appears as a location outlier compared to the rest of the group.';
                        const tooltipParts = [];
                        if (hasPhoto) tooltipParts.push(photoLabel);
                        if (hasLocation) tooltipParts.push(locationLabel);
                        if (tooltipParts.length === 0 && parts.length) tooltipParts.push(parts[0]);
                        if (tooltipParts.length === 0) tooltipParts.push(photoLabel);
                        const tooltipText = tooltipParts.join('\n');
                        const tooltipEscaped = tooltipText.replace(/"/g, '&quot;').replace(/\n/g, '&#10;');
                        let statusHtml;
                        if (!r.suspicious) {
                            statusHtml = '<span class="status-ok">✓ OK</span>';
                        } else if (hasPhoto && hasLocation) {
                            statusHtml = `<span class="status-issues-list" title="${tooltipEscaped}"><span class="status-photo-issue">• ${photoLabel}</span><span class="status-location-issue">• ${locationLabel}</span></span>`;
                        } else if (hasPhoto) {
                            statusHtml = `<span class="status-photo-issue" title="${tooltipEscaped}">${photoLabel}</span>`;
                        } else if (hasLocation) {
                            statusHtml = `<span class="status-location-issue" title="${tooltipEscaped}">${locationLabel}</span>`;
                        } else {
                            statusHtml = `<span class="status-issue" title="${tooltipEscaped}">${tooltipParts[0]}</span>`;
                        }
                        const status = statusHtml;
                        const photoUrl = r.photo_path ? `/captured-photo?path=${encodeURIComponent(r.photo_path)}` : PLACEHOLDER_SVG;
                        const photoCell = `<td class="photo-cell"><img src="${photoUrl}" alt="${(r.student_id || '').replace(/"/g, '&quot;')}" loading="lazy" title="${(r.student_id || '').replace(/"/g, '&quot;')}" onerror="this.onerror=null;this.src=window.PLACEHOLDER_SVG"><span class="photo-id mono">${(r.student_id || '').replace(/</g, '&lt;')}</span></td>`;
                        return `<tr>${photoCell}<td class="mono">${r.student_id || ''}</td><td>${r.student_digipin || ''}</td><td class="muted">${latlong}</td><td class="muted">${scanned}</td><td>${status}</td></tr>`;
                    }).join('');
                } catch (e) {
                    const body = document.getElementById('attendanceBody');
                    body.innerHTML = '<tr><td colspan="6" class="error-state">Error loading attendance</td></tr>';
                }
            }

            // Refresh on button click
            async function refreshAttendance() {
                const btn = document.getElementById('refreshBtn');
                if (btn) { btn.disabled = true; btn.textContent = '↻ Loading...'; }
                await fetchAttendance();
                if (btn) { btn.disabled = false; btn.textContent = '↻ Refresh'; }
            }
            fetchAttendance();
    </script>
</body>
</html>
